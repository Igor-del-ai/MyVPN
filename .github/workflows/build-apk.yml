name: Build MyVPN APK
# Rebuild trigger: generate the Android VPN APK

on:
  workflow_dispatch:
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MyVPN
        uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0

      - name: Checkout matching sing-box source
        uses: actions/checkout@v5
        with:
          repository: SagerNet/sing-box
          ref: v1.15.0-alpha.13
          path: sing-box
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK and NDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" "ndk;28.0.13004108"
          # Android publishes API 37 as android-37.0, while this AGP build
          # resolves compileSdk 37 using the legacy android-37 directory name.
          if [ -d "$SDK_ROOT/platforms/android-37.0" ] && [ ! -e "$SDK_ROOT/platforms/android-37" ]; then
            ln -s android-37.0 "$SDK_ROOT/platforms/android-37"
          fi
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/28.0.13004108" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.5'
          cache: false

      - name: Install gomobile tools
        run: |
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.12
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build matching libbox Android libraries
        working-directory: sing-box
        run: go run ./cmd/internal/build_libbox -target android

      - name: Add libbox libraries to Android app
        run: |
          mkdir -p app/libs
          cp sing-box/libbox.aar app/libs/libbox.aar
          cp sing-box/libbox-legacy.aar app/libs/libbox-legacy.aar
          test -s app/libs/libbox.aar
          test -s app/libs/libbox-legacy.aar

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build Android APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleOtherDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: MyVPN-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
